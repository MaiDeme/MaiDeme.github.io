{%- if site.minima.dark_mode == nil -%}
  {%- assign dark_mode = site.minima.dark_mode | default: false -%}
{%- else -%}
  {%- assign dark_mode = site.minima.dark_mode -%}
{%- endif -%}
<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}"{%- if dark_mode %} class="dark"{%- endif %}>
  {%- include head.html -%}
  <body>
    {%- include header.html -%}
    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>
    {%- include footer.html -%}
  </body>
</html>
